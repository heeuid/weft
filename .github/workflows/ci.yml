# weft on the systems it runs on and connects to: the whole suite on
# Windows, macOS and Linux; each system to itself over a real ssh; the
# remote side (weft-core: bootstrap, shells, agent) on other Linuxes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The Rust weft is built and checked with (a new one brings new clippy
  # lints: it is tried apart, in "newer Rust", and this moved up on purpose).
  RUST_VERSION: "1.96.0"

jobs:
  # The local side: build, lint and the whole suite on each system.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build packages and shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev xvfb zsh fish tcsh ksh mksh dash busybox-static
      - name: macOS shells
        if: runner.os == 'macOS'
        run: brew install fish
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # The remote side over a real ssh: each system to itself.
  ssh:
    name: ssh to itself (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - name: sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
      - name: sshd (macOS)
        if: runner.os == 'macOS'
        run: sudo systemsetup -setremotelogin on
      - name: key (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          printf 'Host localhost\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          ssh -o BatchMode=yes localhost true
      - name: sshd and key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          # An empty passphrase: PowerShell 7 passes '""' as the two quote
          # marks themselves, and the key asked for them (publickey refused).
          ssh-keygen -t ed25519 -N '' -f "$env:USERPROFILE\.ssh\id_ed25519" -q
          ssh-keygen -y -P '' -f "$env:USERPROFILE\.ssh\id_ed25519" | Out-Null
          if ($LASTEXITCODE) { throw "the key was made with a passphrase" }
          $pub = Get-Content "$env:USERPROFILE\.ssh\id_ed25519.pub"
          # The runner's user is an administrator: its keys are read from here.
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $keys -Value $pub -Encoding ascii
          icacls $keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"
          Add-Content "$env:USERPROFILE\.ssh\config" "Host localhost`n  StrictHostKeyChecking accept-new"
          ssh -o BatchMode=yes localhost "echo connected"
          "WEFT_TEST_SSH_SHELL=windows" >> $env:GITHUB_ENV
      - name: weft over ssh
        env:
          WEFT_TEST_SSH: localhost
        run: cargo test -p weft-core over_ssh_where_one_is_given -- --nocapture
      # macOS's bash is 3.2, CentOS 7's 4.2: no PS0, and 3.2 reads no rcfile
      # from a pipe. Each as the login shell and the bash on the ssh PATH.
      - name: weft over ssh with old bash (Linux)
        if: runner.os == 'Linux'
        env:
          WEFT_TEST_SSH: localhost
        run: |
          sudo apt-get install -y byacc
          # A user's `set -u` too: bash < 4.4's trap ran into unset names.
          # (In ~/.bashrc, which ~/.profile reads: a ~/.bash_profile would
          # take their place, and the runner's prompt with them.)
          echo 'set -u' >> ~/.bashrc
          for v in 3.2.57 4.2.53; do
            curl -sSfL "https://ftp.gnu.org/gnu/bash/bash-$v.tar.gz" | tar xz
            # The C of their time for every compile, their build tools too
            # (gcc 15 takes C23, where f() has no arguments).
            flags="-O2 -std=gnu89 -fcommon -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-implicit-int"
            (cd "bash-$v" && CC="gcc -std=gnu89" CFLAGS="$flags" CFLAGS_FOR_BUILD="$flags" ./configure --prefix="$HOME/bash-$v" --without-bash-malloc > /dev/null && make -j4 > /dev/null && make install > /dev/null)
            echo "$HOME/bash-$v/bin/bash" | sudo tee -a /etc/shells
            sudo ln -sf "$HOME/bash-$v/bin/bash" /usr/local/bin/bash
            sudo usermod -s "$HOME/bash-$v/bin/bash" "$USER"
            ssh -o BatchMode=yes localhost 'echo "login shell: $BASH_VERSION; on PATH: $(bash -c "echo \$BASH_VERSION")"'
            cargo test -p weft-core over_ssh_where_one_is_given -- --nocapture
          done
          sudo rm /usr/local/bin/bash
          sudo usermod -s /bin/bash "$USER"

  # The remote side on other Linuxes: weft's command, its shells and the
  # agent (weft-core has no GUI).
  remote:
    name: remote side (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:8
            # --nobest: a mirror with a newer gcc than its libgcc (seen twice)
            # still gives a gcc that installs.
            setup: dnf install -y --nobest gcc curl git python3 procps-ng which zsh tcsh ksh
          - image: debian:12
            setup: apt-get update && apt-get install -y gcc curl git python3 procps zsh fish tcsh ksh mksh dash busybox-static
          - image: alpine:3.20
            setup: apk add --no-cache gcc musl-dev curl git python3 procps bash
    steps:
      - name: packages
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v5
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain "$RUST_VERSION"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: test
        run: cargo test -p weft-core

  # The newest Rust: its new lints and warnings, seen before the version
  # above is moved up. It does not fail the run.
  newer-rust:
    name: newer Rust (not required)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
