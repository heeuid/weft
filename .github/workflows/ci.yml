# weft on the systems it runs on and connects to: the whole suite on
# Windows, macOS and Linux; each system to itself over a real ssh; the
# remote side (weft-core: bootstrap, shells, agent) on other Linuxes.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # The local side: build, lint and the whole suite on each system.
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux build packages and shells
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgtk-3-dev zsh fish tcsh ksh mksh dash busybox-static
      - name: macOS shells
        if: runner.os == 'macOS'
        run: brew install fish
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace

  # The remote side over a real ssh: each system to itself.
  ssh:
    name: ssh to itself (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: sshd (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server
          sudo systemctl start ssh
      - name: sshd (macOS)
        if: runner.os == 'macOS'
        run: sudo systemsetup -setremotelogin on
      - name: key (Linux, macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519 -q
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          chmod go-w ~
          printf 'Host localhost\n  StrictHostKeyChecking accept-new\n' >> ~/.ssh/config
          ssh -o BatchMode=yes localhost true
      - name: sshd and key (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0
          Start-Service sshd
          New-Item -ItemType Directory -Force "$env:USERPROFILE\.ssh" | Out-Null
          ssh-keygen -t ed25519 -N '""' -f "$env:USERPROFILE\.ssh\id_ed25519" -q
          $pub = Get-Content "$env:USERPROFILE\.ssh\id_ed25519.pub"
          # The runner's user is an administrator: its keys are read from here.
          $keys = "$env:ProgramData\ssh\administrators_authorized_keys"
          Set-Content -Path $keys -Value $pub -Encoding ascii
          icacls $keys /inheritance:r /grant "Administrators:F" /grant "SYSTEM:F"
          Add-Content "$env:USERPROFILE\.ssh\config" "Host localhost`n  StrictHostKeyChecking accept-new"
          ssh -o BatchMode=yes localhost "echo connected"
          "WEFT_TEST_SSH_SHELL=windows" >> $env:GITHUB_ENV
      - name: weft over ssh
        env:
          WEFT_TEST_SSH: localhost
        run: cargo test -p weft-core over_ssh_where_one_is_given -- --nocapture

  # The remote side on other Linuxes: weft's command, its shells and the
  # agent (weft-core has no GUI).
  remote:
    name: remote side (${{ matrix.image }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: rockylinux:8
            setup: dnf install -y gcc curl git python3 procps-ng which zsh tcsh ksh
          - image: debian:12
            setup: apt-get update && apt-get install -y gcc curl git python3 procps zsh fish tcsh ksh mksh dash busybox-static
          - image: alpine:3.20
            setup: apk add --no-cache gcc musl-dev curl git python3 procps bash
    steps:
      - name: packages
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: test
        run: cargo test -p weft-core
