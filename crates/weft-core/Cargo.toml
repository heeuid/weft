[package]
name = "weft-core"
version.workspace = true
edition = "2021"
description = "weft without its window: the terminal grid and parser, ptys, hosts and their agents, search, records, secrets"

[dependencies]
vte = "0.15"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.1"
regex = "1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
chacha20 = "0.9"
zeroize = "1"
getrandom = "0.2"
serialport = { version = "4", default-features = false }
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "user"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Foundation", "Win32_UI_Shell"] }

[target."cfg(unix)".dependencies]
libc = "0.2"
