[package]
name = "weft-draw"
version.workspace = true
edition = "2021"
description = "What weft draws with: theme and fonts, icons, syntax colours, markdown layout, key names"

[dependencies]
egui = "0.31"
syntect = { version = "5.3", default-features = false, features = ["default-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
ttf-parser = "0.25"
