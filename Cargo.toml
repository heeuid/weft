[package]
name = "weft"
version.workspace = true
license.workspace = true
edition = "2021"
description = "weft - a terminal that weaves GUI widgets into the TUI grid; thick local client, thin ssh/POSIX/python remote"

[workspace]
members = ["crates/weft-core", "crates/weft-draw"]

# One version for weft and its crates: raised here, with CHANGELOG.md.
[workspace.package]
version = "0.13.0"
license = "MIT"

[dependencies]
weft-core = { path = "crates/weft-core" }
weft-draw = { path = "crates/weft-draw" }
eframe = { version = "0.31", features = ["wgpu"] }
# eframe's wgpu comes with no backend of its own: DirectX 12 (Windows) and
# Metal (macOS) here; Vulkan (Linux) wgpu has by itself.
wgpu = { version = "24", default-features = false, features = ["wgsl", "dx12", "metal"] }
egui = "0.31"
sys-locale = "0.3"
vte = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
regex = "1"
mermaid-svg = "0.7.0"
resvg = "0.49"
hayro = "0.9.0"
zeroize = "1"
serialport = { version = "4", default-features = false }

[dev-dependencies]
# Names as macOS writes them, in the tests.
unicode-normalization = "0.1"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
debug = false

# Files dragged out to other apps: each system's own drag.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
drag = "2.1"

[target.'cfg(not(any(windows, target_os = "macos")))'.dependencies]
x11rb = "0.13"
raw-window-handle = "0.6"

[target.'cfg(not(any(windows, target_os = "macos")))'.dev-dependencies]
# The drag out's test moves and presses the pointer of an X server of its own.
x11rb = { version = "0.13", features = ["xtest"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_WindowsAndMessaging"] }

# `cargo test` and `cargo build` without --release: the dependencies fully
# optimized (egui, fonts and the syntax tables are far too slow otherwise),
# weft's own crates lightly and incrementally, so a change builds in moments.
[profile.dev]
opt-level = 1
debug = 0

[profile.dev.package."*"]
opt-level = 3
