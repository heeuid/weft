[package]
name = "weft"
version = "0.1.0"
edition = "2021"
description = "weft - a terminal that weaves GUI widgets into the TUI grid; thick local client, thin ssh/POSIX/python remote"

[dependencies]
eframe = "0.31"
egui = "0.31"
vte = "0.15"
portable-pty = "0.9.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
flate2 = "1.1"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.release]
opt-level = 3
debug = false
